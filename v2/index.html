<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pure Nature V2 – in Arbeit</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2386b86f'/%3E%3Cpath d='M16 6c6 4 6 16 0 20c-6-4-6-16 0-20z' fill='%230a0f0e'/%3E%3C/svg%3E">
<style>
@font-face{font-family:"Figtree";font-weight:400;font-display:swap;src:url(../fonts/figtree-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-weight:600;font-display:swap;src:url(../fonts/figtree-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Bricolage Grotesque";font-weight:700;font-display:swap;src:url(../fonts/bricolage-grotesque-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-weight:400;font-display:swap;src:url(../fonts/jetbrains-mono-latin-400-normal.woff2) format("woff2")}
:root{--night:#0a0f0e;--panel:#101816;--line:#24332e;--ink:#e6ede4;--muted:#8b9d94;--pollen:#e7ad4f;color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--night)}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--night);color:var(--ink);
  font:16px/1.55 "Figtree","Segoe UI",system-ui,sans-serif;padding:32px max(16px,env(safe-area-inset-left,0px))}
main{max-width:560px;text-align:center}
.tape{display:inline-block;font:400 13px/1 "JetBrains Mono",ui-monospace,monospace;letter-spacing:.12em;color:var(--night);
  padding:9px 16px;border-radius:6px;transform:rotate(-2deg);
  background:repeating-linear-gradient(135deg,var(--pollen) 0 14px,#c98f34 14px 28px)}
h1{font:700 clamp(44px,10vw,72px)/1 "Bricolage Grotesque","Segoe UI",system-ui,sans-serif;letter-spacing:-.03em;margin:26px 0 12px}
h1 span{color:var(--pollen)}
p{color:var(--muted);margin:0 0 28px}
.dots{display:flex;gap:8px;justify-content:center;margin:0 0 28px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--pollen);opacity:.25;animation:blink 1.4s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none;opacity:.6}}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.warn{color:var(--pollen);border:1px dashed var(--pollen);border-radius:12px;padding:12px 16px;font-size:15px}
a.btn{font-weight:600;font-size:14px;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:11px 16px}
a.btn.primary{background:var(--pollen);border-color:var(--pollen);color:var(--night)}
a.btn:hover{border-color:var(--pollen)}
a:focus-visible{outline:2px solid var(--pollen);outline-offset:3px}
</style>
</head>
<body>
<main>
  <span class="tape">WORK IN PROGRESS</span>
  <h1>V<span>2</span></h1>
  <p>Hier entsteht eine neue Fassung von Pure Nature. Noch gibt es nichts zu sehen. Der erste Entwurf der Datenbank liegt im <a href="../archiv/" style="color:var(--pollen)">Archiv</a>.</p>
  <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="btns">
    <a class="btn primary" href="../dev/">Zur Dev-Fassung</a>
    <a class="btn" href="../">← Alle Fassungen</a>
  </div>
</main>
</body>
</html>
